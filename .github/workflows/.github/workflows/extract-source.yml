name: Extract APK Source Code

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct download URL for .apk (up to 1 GB)"
        required: true
        type: string
      tag_name:
        description: "Release tag name"
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools (apktool, jadx, zip, unzip, curl, java)
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool jadx zip unzip curl openjdk-17-jdk-headless

      - name: Download APK and extract source code
        env:
          MAX_BYTES: "1073741824"
          JAVA_OPTS: "-Xmx3g"
        run: |
          set -euo pipefail
          mkdir -p work out source_bundle

          # 1. Direct HTTPS URL se APK download karein (1 GB tak)
          curl -fSL --retry 3 --retry-delay 2 --max-filesize "$MAX_BYTES" "${{ inputs.apk_url }}" -o work/target.apk

          # 2. apktool se Smali, AndroidManifest.xml, Resources aur Assets nikalo (repackable source)
          apktool -Xmx3g d -f work/target.apk -o source_bundle/apktool_decoded

          # 3. jadx se Java/Kotlin readable source nikalo (reference/inspection ke liye)
          jadx -j 2 -d source_bundle/jadx_java work/target.apk || true

          # 4. Dono (apktool_decoded + jadx_java) ko ek ZIP mein bundle karein
          (
            cd source_bundle
            zip -rq ../out/apk-source-code.zip .
          )

          ls -lh out/apk-source-code.zip

      - name: Upload source ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: out/apk-source-code.zip
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
